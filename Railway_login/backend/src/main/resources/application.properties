# ===================================================================
# Railway Management System - Passenger & User Management Module
# Application Configuration
# ===================================================================

server.port=8080
spring.application.name=railway-user-management

# -------------------------------------------------------------------
# MySQL Database Connection (Placeholders with Environment Fallbacks)
# Override via environment variables or set actual credentials below:
# DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:railway_management}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Rushi@12}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# Spring Data JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Disable automatic execution of schema.sql by Spring SQL init so Hibernate manages DDL
# (schema.sql is provided for manual/DBA initialization)
spring.sql.init.mode=never

# -------------------------------------------------------------------
# JWT Configuration
# -------------------------------------------------------------------
# 256-bit base64-encoded secret key
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Expiration: 24 hours (86400000 ms)
jwt.expiration=${JWT_EXPIRATION:86400000}

# -------------------------------------------------------------------
# Admin Demo Account Configuration
# -------------------------------------------------------------------
admin.email=${ADMIN_EMAIL:admin@railway.com}
admin.password=${ADMIN_PASSWORD:Admin@123}

# -------------------------------------------------------------------
# Synthetic Passenger Generation Configuration
# -------------------------------------------------------------------
synthetic.passengers.target-count=${SYNTHETIC_TARGET_COUNT:10000}
synthetic.passengers.batch-size=${SYNTHETIC_BATCH_SIZE:1000}


